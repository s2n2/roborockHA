name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Topics only matter for the HACS default store; this is a custom repository.
          ignore: brands topics

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python scripts/check_repository.py
      - run: python -m pytest -q tests --ignore-glob="*browser*" --ignore=tests/test_frontend.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/dobby_scheduler/frontend/dobby-scheduler-card.js
      - run: node tests/check_card_registration.cjs
